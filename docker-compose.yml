version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: ledger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ledger_db}
      POSTGRES_USER: ${DB_USER:-ledger_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledger_pass}
    ports:
      - "5432:5432"
    volumes:
      - ledger_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ledger_user} -d ${DB_NAME:-ledger_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ledger-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ledger_db}
      DB_USER: ${DB_USER:-ledger_user}
      DB_PASSWORD: ${DB_PASSWORD:-ledger_pass}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: ledger-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ledger_pg_data:
